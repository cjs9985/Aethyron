[package]
name = "aethyron-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bcrypt = "0.12"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
async-trait = "0.1"
walkdir = "2"
